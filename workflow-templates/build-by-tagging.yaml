name: Docker Build by tagging

on:
  create:
    tags:
      - '*'

env:
  DOCKERHUB_REPO: <Docker Hub repo name>

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest-2core  # ubuntu-latest-4core
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Get tag name
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Extract name from package.json
        uses: sergeysova/jq-action@v2
        id: name
        with:
          cmd: 'jq .name package.json -r'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REPO_ACCESS_APP_ID }}
          private-key: ${{ secrets.REPO_ACCESS_APP_PK }}
          owner: ${{ github.repository_owner }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: lambda256/${{ env.DOCKERHUB_REPO }}:${{ steps.name.outputs.value }}_${{ env.TAG }}
          build-args: |
            "PAT=${{ steps.app-token.outputs.token }}"

      - name: Send Slack Notification
        id: slack
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ vars.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # This data can be any valid JSON from a previous step in the GitHub Action
          payload: |
            {
              "image": "lambda256/${{ env.DOCKERHUB_REPO }}:${{ steps.name.outputs.value }}_${{ env.TAG }}"
            }
